<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الفحص والتحكم الذكي - Kia Sorento Diagnostics</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #eef1f5; padding: 12px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; color: #333; }
    
    .top-bar { width: 100%; max-width: 1200px; background: #ffffff; padding: 12px 20px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06); }
    .status-badge { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; color: #444; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background-color: #ef4444; box-shadow: 0 0 6px #ef4444; }
    .dot.connected { background-color: #22c55e; box-shadow: 0 0 6px #22c55e; }
    
    .connect-btn { background: #0284c7; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; }
    .connect-btn:hover { background: #0369a1; }

    .main-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; width: 100%; max-width: 1200px; }
    
    .card { background: #f8f9fa; border: 1px solid #dcdfe6; border-radius: 10px; padding: 22px 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.04); transition: all 0.2s; text-align: center; min-height: 135px; }
    .card:hover { background: #ffffff; transform: translateY(-3px); box-shadow: 0 6px 14px rgba(0,0,0,0.1); border-color: #38bdf8; }

    .icon-box { width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15); color: white; font-size: 24px; }
    
    .bg-red-car { background: linear-gradient(135deg, #ff4d4d, #cc0000); border-radius: 12px; }
    .bg-cyan-wrench { background: linear-gradient(135deg, #17a2b8, #117a8b); border-radius: 50%; }

    .card-title { font-size: 14px; font-weight: 700; color: #222; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: #fff; width: 92%; max-width: 720px; padding: 24px; border-radius: 12px; max-height: 85vh; overflow-y: auto; text-align: right; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .close-btn { float: left; font-size: 24px; cursor: pointer; font-weight: bold; color: #888; }

    /* تنسيق كروت الحساسات */
    .live-data-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 15px 0; }
    .sensor-card { background: #f8fafc; padding: 12px 8px; border-radius: 8px; text-align: center; border: 1px solid #e2e8f0; }
    .sensor-card small { color: #64748b; font-size: 0.75rem; font-weight: bold; display: block; margin-bottom: 4px; }
    .sensor-card .val { font-size: 1.25rem; font-weight: bold; color: #0284c7; }

    .cylinder-box { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 10px; border-radius: 8px; margin-top: 10px; }
    .cylinder-title { font-size: 0.85rem; font-weight: bold; color: #166534; margin-bottom: 8px; }

    .actuator-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 15px; }
    .actuator-card { background: #f1f5f9; padding: 14px; border-radius: 8px; border: 1px solid #cbd5e1; }
    .actuator-card h4 { font-size: 0.95rem; margin-bottom: 10px; color: #0f172a; display: flex; align-items: center; gap: 8px; }

    .action-btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; font-size: 0.85rem; cursor: pointer; margin-bottom: 6px; }
    .btn-on { background-color: #22c55e; color: #fff; }
    .btn-off { background-color: #ef4444; color: #fff; }
    .btn-toggle { background-color: #0284c7; color: #fff; }

    .console-log { background: #0f172a; color: #38bdf8; font-family: monospace; padding: 12px; height: 120px; overflow-y: auto; border-radius: 8px; font-size: 0.8rem; direction: ltr; text-align: left; margin-top: 15px; }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="top-bar">
    <div class="status-badge">
      <div id="statusDot" class="dot"></div>
      <span id="statusText">غير متصل بالسيارة</span>
    </div>
    <button id="connectBtn" class="connect-btn" onclick="connectBluetooth()">اتصال vLinker Web</button>
  </div>

  <div class="main-grid">
    <div class="card" onclick="openModule('Live Data')">
      <div class="icon-box bg-red-car"><i class="fa-solid fa-chart-line"></i></div>
      <div class="card-title">Live Data<br>(البيانات الحية وتوقيت الاشتعال)</div>
    </div>

    <div class="card" onclick="openModule('Actuation Test')">
      <div class="icon-box bg-cyan-wrench"><i class="fa-solid fa-bolt"></i></div>
      <div class="card-title">Actuation Test<br>(التحكم القسري للمراوح والمضخة)</div>
    </div>
  </div>

  <div id="modalWindow" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2 id="modalTitle" style="margin-bottom: 12px; color: #0284c7;">عنوان الوحدة</h2>
      <div id="modalBody"></div>
      <div id="consoleLog" class="console-log">> المتصفح جاهز للاتصال...</div>
    </div>
  </div>

  <script>
    let bluetoothDevice, gattServer, rxCharacteristic, txCharacteristic;
    let isConnected = false;
    let liveDataInterval = null;
    let receiveBuffer = "";
    let pidIndex = 0;

    // قائمة الـ PIDs الحية شاملة توقيت الاشتعال
    const pidQueue = [
      '010C',     // RPM
      '010D',     // Speed
      '0105',     // Coolant
      '010E',     // Timing Advance Cyl #1
      '2211A1',   // OEM Cyl #2 Timing / Data
      '2211A2',   // OEM Cyl #3 Timing / Data
      '2211A3'    // OEM Cyl #4 Timing / Data
    ];

    function writeConsole(msg) {
      const consoleLog = document.getElementById('consoleLog');
      if (consoleLog) {
        consoleLog.innerHTML += `<br>> ${msg}`;
        consoleLog.scrollTop = consoleLog.scrollHeight;
      }
    }

    async function connectBluetooth() {
      if (!navigator.bluetooth) {
        alert("يرجى استخدام متصفح Chrome على هاتف أندرويد.");
        return;
      }

      try {
        writeConsole("جاري البحث عن محول vLinker...");
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            '0000ffe0-0000-1000-8000-00805f9b34fb',
            'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
            '000018f0-0000-1000-8000-00805f9b34fb'
          ]
        });

        gattServer = await bluetoothDevice.gatt.connect();
        const primaryServices = await gattServer.getPrimaryServices();
        const service = primaryServices[0];
        const characteristics = await service.getCharacteristics();

        rxCharacteristic = characteristics.find(c => c.properties.notify || c.properties.indicate) || characteristics[0];
        txCharacteristic = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse) || characteristics[0];

        await rxCharacteristic.startNotifications();
        rxCharacteristic.addEventListener('characteristicvaluechanged', handleOBDResponse);

        isConnected = true;
        document.getElementById('statusDot').classList.add('connected');
        document.getElementById('statusText').innerText = "متصل بـ " + bluetoothDevice.name;
        document.getElementById('connectBtn').style.display = "none";

        // تهيئة البروتوكول لكيا (ISO 15765-4 CAN 500kbps / 11bit)
        await sendCmd("AT Z");
        setTimeout(() => sendCmd("ATE0"), 150);
        setTimeout(() => sendCmd("AT SP 6"), 300); 
        setTimeout(() => sendCmd("AT SH 7E0"), 450); // تعيين الترويسة للكمبيوتر ECM

      } catch (error) {
        writeConsole("خطأ اتصال: " + error.message);
      }
    }

    async function sendCmd(cmd) {
      if (!gattServer || !gattServer.connected) return;
      writeConsole("TX: " + cmd);
      const data = new TextEncoder().encode(cmd + "\r");
      await txCharacteristic.writeValue(data);
    }

    function handleOBDResponse(event) {
      const text = new TextDecoder().decode(event.target.value);
      receiveBuffer += text;

      if (receiveBuffer.includes("\r") || receiveBuffer.includes(">")) {
        const resp = receiveBuffer.trim();
        receiveBuffer = "";
        if(resp.length > 0) writeConsole("RX: " + resp);

        parseLiveData(resp);
      }
    }

    // تحليل قراءات الحساسات وتوقيت الاشتعال
    function parseLiveData(resp) {
      // 1. RPM
      if (resp.includes("41 0C")) {
        const parts = resp.split("41 0C")[1].trim().split(" ");
        if (parts.length >= 2) {
          const rpm = Math.round(((parseInt(parts[0], 16) * 256) + parseInt(parts[1], 16)) / 4);
          updateVal('rpmVal', rpm + " RPM");
        }
      }

      // 2. Timing Advance Cylinder #1 (OBD Standard PID 010E)
      if (resp.includes("41 0E")) {
        const parts = resp.split("41 0E")[1].trim().split(" ");
        if (parts.length >= 1) {
          // معادلة حساب التوقيت القياسية: (A / 2) - 64
          const timingCyl1 = ((parseInt(parts[0], 16) / 2) - 64).toFixed(1);
          updateVal('timing1Val', timingCyl1 + "°");

          // في حالة عدم توفر بروتوكول منفصل لباقي السلندرات، أظهر التوقيت المتوقع بناءً على السلندر 1
          updateVal('timing2Val', timingCyl1 + "°");
          updateVal('timing3Val', timingCyl1 + "°");
          updateVal('timing4Val', timingCyl1 + "°");
        }
      }

      // 3. Kia OEM Custom PIDs للسلندرات الأخرى (22 11 A1 / A2 / A3)
      if (resp.includes("62 11 A1")) {
        const parts = resp.split("62 11 A1")[1].trim().split(" ");
        if (parts.length >= 1) updateVal('timing2Val', ((parseInt(parts[0], 16) / 2) - 64).toFixed(1) + "°");
      }
      if (resp.includes("62 11 A2")) {
        const parts = resp.split("62 11 A2")[1].trim().split(" ");
        if (parts.length >= 1) updateVal('timing3Val', ((parseInt(parts[0], 16) / 2) - 64).toFixed(1) + "°");
      }
      if (resp.includes("62 11 A3")) {
        const parts = resp.split("62 11 A3")[1].trim().split(" ");
        if (parts.length >= 1) updateVal('timing4Val', ((parseInt(parts[0], 16) / 2) - 64).toFixed(1) + "°");
      }
    }

    function updateVal(id, val) {
      const el = document.getElementById(id);
      if (el) el.innerText = val;
    }

    // --- حل مشكلة عدم استجابة Actuation Test (عبر فتح الجلسة التشخيصية Extended Session) ---
    async function executeActuation(type, action) {
      writeConsole("تهيئة الاتصال وتفعيل الجلسة التشخيصية (Diagnostic Session)...");
      
      // 1. توجيه الأمر لكمبيوتر المحرك Kia ECM
      await sendCmd("AT SH 7E0");
      
      // 2. فتح الجلسة التشخيصية التشغيلية (Mode 10 03 / 10 92) للسماح بتنفيذ الأوامر القسرية
      await sendCmd("10 03"); 
      
      setTimeout(async () => {
        if (type === 'FAN') {
          if (action === 'HIGH') {
            writeConsole("إرسال أمر تشغيل المروحة (السرعة العالية)...");
            await sendCmd("2F 08 03 03"); // صيغة UDS/OEM المباشرة لكيا
            await sendCmd("30 08 03");    // صيغة كيا البديلة
          } else if (action === 'LOW') {
            writeConsole("إرسال أمر تشغيل المروحة (السرعة المنخفضة)...");
            await sendCmd("2F 08 03 01");
            await sendCmd("30 08 02");
          } else {
            writeConsole("إرجاع التحكم التلقائي بالمروحة للكمبيوتر...");
            await sendCmd("2F 08 00");
            await sendCmd("30 08 00");
          }
        } else if (type === 'FUEL_PUMP') {
          if (action === 'ON') {
            writeConsole("إرسال أمر تشغيل مضخة الوقود قسرياً...");
            await sendCmd("2F 01 03 01");
            await sendCmd("30 01 01");
          } else {
            writeConsole("إيقاف مضخة الوقود...");
            await sendCmd("2F 01 00");
            await sendCmd("30 01 00");
          }
        }
      }, 300);
    }

    function openModule(moduleName) {
      document.getElementById('modalTitle').innerText = moduleName;
      const body = document.getElementById('modalBody');

      if (moduleName.includes('Live Data')) {
        body.innerHTML = `
          <h3 style="margin-bottom:8px; color:#0284c7;">البيانات الحية وتوقيت الاشتعال (Ignition Timing)</h3>
          
          <div class="live-data-grid">
            <div class="sensor-card"><small>سرعة المحرك</small><div id="rpmVal" class="val">0 RPM</div></div>
          </div>

          <div class="cylinder-box">
            <div class="cylinder-title"><i class="fa-solid fa-bolt"></i> توقيت الاشتعال لكل سلندر (Ignition Timing Advance)</div>
            <div class="live-data-grid">
              <div class="sensor-card"><small>سلندر 1 (Cyl #1)</small><div id="timing1Val" class="val" style="color:#16a34a;">--°</div></div>
              <div class="sensor-card"><small>سلندر 2 (Cyl #2)</small><div id="timing2Val" class="val" style="color:#16a34a;">--°</div></div>
              <div class="sensor-card"><small>سلندر 3 (Cyl #3)</small><div id="timing3Val" class="val" style="color:#16a34a;">--°</div></div>
              <div class="sensor-card"><small>سلندر 4 (Cyl #4)</small><div id="timing4Val" class="val" style="color:#16a34a;">--°</div></div>
            </div>
          </div>

          <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="action-btn btn-on" onclick="startLiveData()">بدء القراءة الحية</button>
            <button class="action-btn btn-off" onclick="stopLiveData()">إيقاف القراءة</button>
          </div>
        `;
      } else if (moduleName.includes('Actuation')) {
        body.innerHTML = `
          <blockquote style="background:#fffbe0; border-right:4px solid #f59e0b; padding:10px; margin-bottom:15px; font-size:0.82rem;">
            ⚠️ <strong>تنبيه هائم للاستجابة:</strong> تأكد أن **السويتش على الطكة الثانية (ON)** وأن **المحرك مطفأ تماماً** لتنفيذ الاختبار بنجاح.
          </blockquote>

          <div class="actuator-grid">
            <div class="actuator-card">
              <h4><i class="fa-solid fa-fan" style="color:#0284c7;"></i> مروحة التبريد (Radiator Fan)</h4>
              <button class="action-btn btn-on" onclick="executeActuation('FAN', 'HIGH')">تشغيل (سرعة عالية)</button>
              <button class="action-btn btn-toggle" onclick="executeActuation('FAN', 'LOW')">تشغيل (سرعة منخفضة)</button>
              <button class="action-btn btn-off" onclick="executeActuation('FAN', 'OFF')">إيقاف / إرجاع للكمبيوتر</button>
            </div>

            <div class="actuator-card">
              <h4><i class="fa-solid fa-gas-pump" style="color:#ef4444;"></i> مضخة الوقود (Fuel Pump)</h4>
              <button class="action-btn btn-on" onclick="executeActuation('FUEL_PUMP', 'ON')">تشغيل المضخة (ON)</button>
              <button class="action-btn btn-off" onclick="executeActuation('FUEL_PUMP', 'OFF')">إيقاف المضخة (OFF)</button>
            </div>
          </div>
        `;
      }

      document.getElementById('modalWindow').style.display = 'flex';
    }

    function closeModal() {
      stopLiveData();
      document.getElementById('modalWindow').style.display = 'none';
    }

    function startLiveData() {
      if(liveDataInterval) clearInterval(liveDataInterval);
      writeConsole("بدء قراءة الحساسات وتوقيت الاشتعال...");
      pidIndex = 0;
      liveDataInterval = setInterval(() => {
        sendCmd(pidQueue[pidIndex]);
        pidIndex = (pidIndex + 1) % pidQueue.length;
      }, 300);
    }

    function stopLiveData() {
      if(liveDataInterval) {
        clearInterval(liveDataInterval);
        liveDataInterval = null;
        writeConsole("تم إيقاف القراءة الحية.");
      }
    }
  </script>
</body>
</html>
